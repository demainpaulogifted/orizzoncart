name: Build OrizzonCart Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'android/**'
      - 'capacitor.config.ts'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/android-build.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: npm ci

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: OrizzonCart-Marketplace-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Publish public APK download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk OrizzonCart-Marketplace.apk
          gh release create "marketplace-${GITHUB_RUN_NUMBER}" \
            OrizzonCart-Marketplace.apk \
            --repo "$GITHUB_REPOSITORY" \
            --title "OrizzonCart Marketplace Android" \
            --notes "Official OrizzonCart Marketplace Android application."
